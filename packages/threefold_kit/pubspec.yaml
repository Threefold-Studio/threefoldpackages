name: threefold_kit
description: >-
  Threefold Studio shared Dart helpers: one app clock with dev time travel,
  calendar dates and day keys, place time zones, money in integer cents, US
  phone formatting and copy style checks. Pure Dart, no Flutter.
version: 0.1.0
publish_to: none
repository: https://github.com/Threefold-Studio/threefoldpackages

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  clock: ^1.1.1
  matcher: ">=0.12.16 <0.13.0"
  timezone: ">=0.9.4 <0.12.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  check_copy: check_copy
